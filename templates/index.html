<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentTrack</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="navbar">
  <h1>TalentTrack</h1>
</header>

<section class="upload-section">
  <form id="uploadForm">
    <input type="file" name="resume" required>
    <button type="submit">Analyze Resume</button>
  </form>
</section>

<section class="results">
  <div class="card">
    <h3>Best Fit Role</h3>
    <h2 id="role">—</h2>
<p>Other roles:</p>
<div id="otherRoles" class="skills-container"></div>


    <a id="linkedinLink" class="linkedin-btn" target="_blank">
      Find Jobs on LinkedIn
    </a>
  </div>

  <div class="card">
    <h3>Extracted Skills</h3>
    <div id="skills"></div>
  </div>

  <div class="card">
  <h3>Missing Skills (for suggested role)</h3>
  <div id="missingSkills"></div>
</div>

  <div class="card">
    <h3>Interview Preparation</h3>
    <ul id="questions"></ul>

    <a id="pdfLink" class="pdf-btn" target="_blank" style="display:none;">
      Download Full Interview Questions (PDF)
    </a>
  </div>
</section>

<footer>
  TalentTrack – Resume and Skill Analysis System
</footer>

<script src="/static/js/main.js"></script>
</body>
</html>
